[package]
name = "furl"
description = "Stateless URL shortener based on arithmetic coding and context modeling"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bstr = "1.13.1"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive"] }
litemap = "0.8.3"
ordered-float = "5.5.0"
radix_trie = { version = "0.3.0", features = ["serde"] }
rayon = "1.12.0"
